name: Windows and Ubuntu checks and packages
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
  CARGO_TARGET_DIR: target
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - name: Format, lint and synthetic/loopback tests
        shell: pwsh
        run: ./scripts/check.ps1 -Loopback
      - name: Build portable Windows amd64 package
        shell: pwsh
        run: ./scripts/package.ps1 -SkipChecks
      - uses: actions/upload-artifact@v4
        with:
          name: DownloadManager-windows-amd64
          path: dist/*

  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Ubuntu build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libssl-dev xvfb xauth
      - name: Format, lint and synthetic/loopback tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --features loopback-tests -- -D warnings
          cargo test --locked --all-targets --features loopback-tests -- --test-threads=2
      - name: Build Ubuntu amd64 package
        run: ./scripts/package-ubuntu.sh
      - name: Install the Ubuntu package and render a settings frame
        run: |
          sudo apt-get install -y --no-remove --no-install-recommends ./dist/*.deb
          export DOWNLOAD_MANAGER_DATA_DIR="$PWD/.local/gui-smoke"
          mkdir -p "$DOWNLOAD_MANAGER_DATA_DIR"
          printf '%s\n' '{"schema":1,"next_id":1,"settings":{"startup_update_check":false},"downloads":[]}' > "$DOWNLOAD_MANAGER_DATA_DIR/state.json"
          xvfb-run -a timeout 10s /usr/bin/download-manager \
            --capture-ui settings "$DOWNLOAD_MANAGER_DATA_DIR/settings.png"
          test -s "$DOWNLOAD_MANAGER_DATA_DIR/settings.png"
      - uses: actions/upload-artifact@v4
        with:
          name: DownloadManager-ubuntu-amd64
          path: dist/*

  publish:
    name: Publish the requested desktop release
    needs: [windows, ubuntu]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release DownloadManager v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: download-manager-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: .release-input
      - name: Verify both packages and prepare release assets
        run: node scripts/stage-platform-release.cjs
      - name: Publish verified assets
        uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./scripts/publish-localization-release.cjs');
            await publish({github, context, core});
