[package]
name = "download-manager"
version = "0.4.4"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A native queued download manager with conservative verified resume"
repository = "https://github.com/siarheisinelnikau/download-manager"

[dependencies]
rust-auto-updator = { git = "https://github.com/siarheisinelnikau/rust-auto-updator", rev = "093e937cae174e0ec57c4485d8ce3b36d90e11f8", version = "=0.4.1" }
anyhow = "1.0.104"
bytemuck = "1.25.2"
egui = { version = "=0.33.3", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "=0.33.3", default-features = false, features = ["clipboard", "x11"] }
egui_software_backend = { version = "=0.0.2", default-features = false, features = ["std"] }
fs2 = "0.4.3"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
softbuffer = { version = "=0.4.8", default-features = false }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
url = "2.5.8"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
tray-icon = { version = "=0.21.3", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
rustix = { version = "1.1", features = ["fs"] }
softbuffer = { version = "=0.4.8", default-features = false, features = ["x11", "x11-dlopen"] }
tray-icon = { version = "=0.21.3", default-features = false }
x11-dl = "2.21"

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3.27.0"

[features]
loopback-tests = []

[[test]]
name = "downloads"
required-features = ["loopback-tests"]

[profile.release]
strip = "symbols"

[patch.crates-io]
tray-icon = { path = "vendor/tray-icon" }

